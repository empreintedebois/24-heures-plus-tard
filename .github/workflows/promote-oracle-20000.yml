name: Promote validated Oracle 20000

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/promote-oracle-20000.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v4
        with:
          ref: oracle-20000-build
          fetch-depth: 0

      - name: Verify validation reports
        run: |
          python - <<'PY'
          import json
          build=json.load(open('build-report.json',encoding='utf-8'))
          tests=json.load(open('test-report.json',encoding='utf-8'))
          assert build['total']==20000
          assert len(build['hour_counts'])==24
          assert min(build['hour_counts'])>=100
          assert min(build['random_band_counts'].values())>0
          assert len(tests['browsers'])==4
          assert all(item['success'] for item in tests['browsers'])
          print('Validation complète confirmée.')
          PY

      - name: Replace the published index and remove build files
        run: |
          cp index-20000.html index.html
          rm -f index-20000.html build-report.json test-report.json build.log browser-test.log
          rm -f scripts/build_oracle_20000.py scripts/test_oracle_20000.mjs
          rm -f .github/workflows/build-oracle-20000.yml
          rm -f .github/workflows/promote-oracle-20000.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit final index.html only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publier Oracle 20000 films validé'
          git push origin HEAD:oracle-20000-build
