name: Build Oracle 20000

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/build_oracle_20000.py
      - scripts/test_oracle_20000.mjs
      - .github/workflows/build-oracle-20000.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: oracle-20000-build
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build from official IMDb datasets
        run: |
          if test -s index-20000.html && test -s build-report.json; then
            echo 'Réutilisation de la construction IMDb déjà générée.' | tee build.log
          else
            set -o pipefail
            python -c "import csv,sys,runpy; csv.field_size_limit(sys.maxsize); runpy.run_path('scripts/build_oracle_20000.py',run_name='__main__')" 2>&1 | tee build.log
          fi

      - name: Static validation
        run: |
          test -s index-20000.html
          test -s build-report.json
          python - <<'PY'
          import json
          r=json.load(open('build-report.json',encoding='utf-8'))
          assert r['total']==20000, r['total']
          assert len(r['hour_counts'])==24
          assert min(r['hour_counts'])>=100, r['hour_counts']
          assert r['random_outside_categories']>0
          print('Couverture:',r['hour_counts'])
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Test Chromium and WebKit mobile interactions
        id: browser_tests
        continue-on-error: true
        run: |
          python -m http.server 8000 >/tmp/oracle-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/test_oracle_20000.mjs 2>&1 | tee browser-test.log

      - name: Prepare downloadable index.html and diagnostics
        if: always()
        run: |
          mkdir -p dist
          cp index-20000.html dist/index.html
          cp build-report.json dist/build-report.json
          test -f test-report.json && cp test-report.json dist/test-report.json || true
          test -f browser-test.log && cp browser-test.log dist/browser-test.log || true
          test -f build.log && cp build.log dist/build.log || true

      - name: Upload site and diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-20000-diagnostics
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Commit generated reports
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-20000.html build-report.json build.log
          test -f test-report.json && git add test-report.json || true
          test -f browser-test.log && git add browser-test.log || true
          git commit -m 'Enregistrer les diagnostics Oracle 20000 [skip ci]' || exit 0
          git push origin HEAD:oracle-20000-build

      - name: Fail when browser tests failed
        if: steps.browser_tests.outcome != 'success'
        run: exit 1
